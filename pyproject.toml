[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pythia"
version = "0.1.0"
description = "Certified lower bounds and attainability estimates for supervised learning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "scipy>=1.12",
    "scikit-learn>=1.5", "matplotlib>=3.8", "networkx>=3.2", "pyyaml>=6.0", "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "coverage[toml]>=7.0"]
mayo = ["xgboost==3.3.0"]

[project.scripts]
pythia = "pythia.cli:main"
peras = "pythia.cli:main"   # deprecated alias

[tool.setuptools.packages.find]
include = ["pythia*", "metis*", "horos*", "peras", "poros"]   # peras/poros: deprecated aliases

[tool.setuptools.package-data]
"pythia.guards" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
